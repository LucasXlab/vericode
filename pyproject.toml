[project]
name = "vericode-cli"
version = "0.1.0"
description = "Verify AI-generated code actually works: type-check, test, secret-scan, and CVE-check — locally, no config."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Noah Forge" }]
keywords = ["ai", "code-review", "static-analysis", "security", "cli", "llm", "verification"]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/LucasXlab/vericode"
Repository = "https://github.com/LucasXlab/vericode"
Issues = "https://github.com/LucasXlab/vericode/issues"

[project.scripts]
vericode = "vericode.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vericode*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["vericode"]
omit = ["tests/*"]
