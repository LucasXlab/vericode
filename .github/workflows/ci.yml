name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # Pin to 24.04: the 3.9 wheel/setup is no longer available on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . pytest pytest-cov ruff
      - name: Lint
        run: python -m ruff check .
      - name: Format gate
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest --cov=vericode --cov-report=term-missing
